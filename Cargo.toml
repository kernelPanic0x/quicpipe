[package]
name = "quicpipe"
version = "0.1.0"
edition = "2024"

# This package is also a member of the rescue-shell workspace. Every shared
# dependency is inherited from [workspace.dependencies] so all members resolve
# exactly one version and feature set per crate.

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"

# 1. Eliminate unhandled panics and debugging leftovers
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
panic = "warn"
panic_in_result_fn = "warn"

# 2. Performance & Memory Smells
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
needless_pass_by_value = "warn"

# 3. Defensive Programming & Safety
indexing_slicing = "warn"
float_cmp = "warn"
shadow_reuse = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
incremental = false

[dependencies]
bytes = { workspace = true }
clap = { workspace = true }
clio = { workspace = true }
color-eyre = { workspace = true }
dialoguer = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
indicatif = { workspace = true }
iroh = { workspace = true }
libc = { workspace = true }
magic-wormhole = { workspace = true }
parking_lot = { workspace = true }
parse-size = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
wincode = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
