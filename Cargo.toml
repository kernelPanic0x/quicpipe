[package]
name = "quicpipe"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
color-eyre = "0.6.5"
dialoguer = { version = "0.12.0", features = ["completion"] }
futures-util = "0.3.34"
hex = "0.4.3"
iroh = "1.1.0"
libc = "0.2.189"
magic-wormhole = "0.8.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
url = "2.5.8"
wincode = { version = "0.6.1", features = ["derive", "bytes"] }
