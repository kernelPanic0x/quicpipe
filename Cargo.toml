[package]
name = "quicpipe"
version = "0.1.0"
edition = "2024"

# Used when quicpipe is built as a standalone binary (outside this workspace).
# Inside the rescue-shell workspace the root [profile.release] applies instead.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
incremental = false

[dependencies]
bytes = { workspace = true }
clap = { workspace = true }
clio = { workspace = true }
color-eyre = { workspace = true }
dialoguer = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
iroh = { workspace = true }
libc = { workspace = true }
magic-wormhole = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
url = { workspace = true }
wincode = { workspace = true }
