[package]
name = "quicpipe"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
color-eyre = "0.6.5"
hex = "0.4.3"
iroh = "1.1.0"
tokio = { version = "1.53.1", features = ["full"] }
wincode = { version = "0.6.1", features = ["derive", "bytes"] }
