[package]
name = "quicpipe"
version = "0.1.0"
edition = "2024"

# This package is also a member of the rescue-shell workspace. Keep the
# dependency versions in sync with rescue-shell's [workspace.dependencies]
# so both share one version per crate via the workspace lockfile.

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"

# 1. Eliminate unhandled panics and debugging leftovers
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
panic = "warn"
panic_in_result_fn = "warn"

# 2. Performance & Memory Smells
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
needless_pass_by_value = "warn"

# 3. Defensive Programming & Safety
indexing_slicing = "warn"
float_cmp = "warn"
shadow_reuse = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
incremental = false

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["std", "derive", "env"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
color-eyre = { version = "0.6.5", default-features = false, features = ["track-caller"] }
dialoguer = { version = "0.12.0", features = ["completion"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
iroh = { version = "1.1.0", features = ["unstable-net-report"] }
libc = "0.2.189"
magic-wormhole = "0.8.1"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "fs",
  "time",
  "sync",
  "signal",
] }
tokio-util = { version = "0.7.19", features = ["codec"] }
url = { version = "2.5.8", default-features = false }
wincode = { version = "0.6.1", features = ["bytes", "derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
